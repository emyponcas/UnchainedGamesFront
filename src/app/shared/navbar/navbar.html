<header class="navbar">
  <div class="navbar-inner">

    <!-- LOGO / MARCA -->
    <div class="nav-left">
      <a routerLink="/" class="brand">
        <span class="brand-box">U</span>
        <span class="brand-text">
          <span class="brand-name">UNCHAINED</span>
          <span class="brand-sub">GAMES</span>
        </span>
      </a>
    </div>

    <!-- ENLACES PRINCIPALES -->
    <nav class="nav-center">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        CATÁLOGO
      </a>

      <a
        *ngIf="isLoggedIn"
        routerLink="/reviews"
        routerLinkActive="active"
      >
        RESEÑAS
      </a>

      <a
        routerLink="/quienes-somos"
        routerLinkActive="active"
      >
        QUIENES SOMOS
      </a>

      <!-- Historial de pedidos solo si está logueado -->
      <a
        *ngIf="isLoggedIn"
        routerLink="/orders"
        routerLinkActive="active"
      >
        HISTORIAL DE PEDIDOS
      </a>
    </nav>

    <!-- ZONA DERECHA: CARRITO + LOGIN/LOGOUT/REGISTER -->
    <div class="nav-right">

      <!-- 🛒 CARRITO SOLO SI ESTÁ LOGUEADO -->
      <a
        *ngIf="isLoggedIn"
        routerLink="/cart"
        class="cart-link"
        aria-label="Carrito"
      >
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge" *ngIf="totalItems > 0">
          {{ totalItems }}
        </span>
      </a>

      <!-- BOTONES CUANDO NO ESTÁ LOGUEADO -->
      <ng-container *ngIf="!isLoggedIn">
        <button
          class="nav-btn"
          type="button"
          (click)="goToLogin()"
        >
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Entrar</span>
        </button>

        <button
          class="nav-btn nav-btn-secondary"
          type="button"
          (click)="goToRegister()"
        >
          <i class="fa-solid fa-user-plus"></i>
          <span>Registrarse</span>
        </button>
      </ng-container>

      <!-- BOTÓN CUANDO SÍ ESTÁ LOGUEADO -->
      <button
        *ngIf="isLoggedIn"
        class="nav-btn"
        type="button"
        (click)="logout()"
      >
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Salir</span>
      </button>
    </div>
  </div>
</header>
