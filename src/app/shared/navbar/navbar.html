<header class="ug-navbar">
  <div class="ug-navbar-inner">

    <!-- LOGO -->
    <div class="ug-logo">
      <!-- Si tienes un logo en assets, usa <img> -->
      <!-- <img src="assets/logo-unchained-games.svg" alt="Unchained Games" /> -->
      <span class="ug-logo-mark">U</span>
      <span class="ug-logo-text">
        <span class="ug-logo-main">UNCHAINED</span>
        <span class="ug-logo-sub">GAMES</span>
      </span>
    </div>

    <!-- MENÚ PRINCIPAL -->
    <nav class="ug-nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Catálogo
      </a>
      <a routerLink="/reviews" routerLinkActive="active">
        Reseñas
      </a>
      <a routerLink="/contact" routerLinkActive="active">
        Contacto
      </a>
      <a
        routerLink="/register"
        routerLinkActive="active"
        *ngIf="!isLoggedIn"
      >
        Registrarse
      </a>
    </nav>

    <!-- ICONO USUARIO / PERFIL -->
    <div class="ug-user-area">

      <!-- Si NO está logueado -->
      <button
        *ngIf="!isLoggedIn"
        class="ug-user-btn"
        type="button"
        (click)="goToLogin()"
        title="Iniciar sesión"
      >
        <i class="fa-solid fa-user"></i>
      </button>

      <!-- Si está logueado -->
      <button
        *ngIf="isLoggedIn"
        class="ug-user-btn logout-btn"
        type="button"
        (click)="logout()"
        title="Cerrar sesión"
      >
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>

    </div>


  </div>
</header>
