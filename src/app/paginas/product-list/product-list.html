<div class="catalog-page">

  <!-- CARRUSEL CATÁLOGO -->

  <div id="ofertas">

    <div id="Carrusel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="10000">

      <div class="carousel-indicators">
        <button type="button" data-bs-target="#Carrusel" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#Carrusel" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#Carrusel" data-bs-slide-to="2"></button>
      </div>

      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="images/of1.png" class="d-block w-100">
        </div>
        <div class="carousel-item">
          <img src="images/of2.png" class="d-block w-100">
        </div>
        <div class="carousel-item">
          <img src="images/of3.png" class="d-block w-100">
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#Carrusel" data-bs-slide="prev">
        <i class="fa-solid fa-chevron-left fa-2x" style="color:#ededed;"></i>
        <span class="visually-hidden">Previous</span>
      </button>

      <button class="carousel-control-next" type="button" data-bs-target="#Carrusel" data-bs-slide="next">
        <i class="fa-solid fa-chevron-right fa-2x" style="color:#ededed;"></i>
        <span class="visually-hidden">Next</span>
      </button>

    </div>

  </div>


  <!-- CABECERA CATÁLOGO -->
  <header class="section-header">
    <h1 class="page-title">Catálogo</h1>
    <p class="page-subtitle">
      Los favoritos de nuestra comunidad. Juegos probados y amados por miles de jugadores.
    </p>
  </header>

  <!-- BOTÓN CREAR PRODUCTO -->
  <div *ngIf="isAdmin"
       class="create-wrapper">
    <a routerLink="/product/create" class="btn-create">Crear producto</a>
  </div>

  <!-- BARRA DE BÚSQUEDA / FILTROS -->
  <div class="catalog-filters">

    <div class="filter-group">
      <label>Buscar juego</label>
      <input
        type="text"
        [(ngModel)]="searchText"
        placeholder="Ej: Catan"
      />
    </div>

    <div class="filter-group">
      <div>
        <button id="filtrarIdioma" (click)="toggleMenu()">Filtrar</button>
      </div>
      <div id="menuFiltroIdioma" [class.visible]="MenuFvisible">
        <span>Idiomas: </span>

        <label *ngFor="let lang of availableLanguages">
          <input
            type="checkbox"
            (change)="onLanguageChange($event, lang)"
            [checked]="selectedLanguages.includes(lang)"
          />
          {{ lang }}
        </label>
      </div>
    </div>

    <div class="filter-actions">
      <button type="button" class="btn-search" (click)="onSearchClick()">
        Buscar
      </button>

      <button type="button" class="btn-clear" (click)="onClearFilters()">
        Limpiar
      </button>
    </div>
  </div>

  <!-- LISTA DE PRODUCTOS -->
  <div class="product-list">

    <div class="product-card" *ngFor="let p of products">

      <!-- Imagen del juego -->
      <div class="product-image-wrapper">
        <img
          *ngIf="p.picture"
          [src]="p.picture"
          [alt]="p.name"
          class="product-image"
        />
      </div>

      <h3 class="product-name">{{ p.name }}</h3>

      <p class="product-description">
        {{ p.description }}
      </p>

      <p class="price">
        {{ p.price }} €
      </p>

      <p class="stock">
        Stock: {{ p.stock }}
      </p>

      <div class="actions">
        <!-- Ver detalle -->
        <a [routerLink]="['/product', p.id]" class="link-detail">
          Ver detalle
        </a>

        <!-- Editar -->
        <a
          *ngIf="isAdmin"
          class="btn-edit"
          [routerLink]="['/product/edit', p.id]"
        >
          Editar
        </a>

        <!-- Eliminar -->
        <a
          *ngIf="isAdmin"
          class="btn-delete"
          [routerLink]="['/product/delete', p.id]"
        >
          Eliminar
        </a>

      </div>
    </div>
  </div>

</div>
