<div class="catalog-page">

  <!-- CABECERA -->
  <div class="section-header">
    <h1 class="page-title">Catálogo</h1>
    <p class="page-subtitle">
      Descubre nuestra selección de juegos de mesa y añádelos a tu carrito.
    </p>
  </div>

  <!-- BOTÓN CREAR PRODUCTO (SOLO ADMIN) -->
  <div class="create-wrapper" *ngIf="isAdmin">
    <a routerLink="/product/create" class="btn-create">
      <i class="fa-solid fa-plus"></i>
      Crear producto
    </a>
  </div>

  <!-- LISTA DE PRODUCTOS -->
  <div class="product-list">

    <div class="product-card" *ngFor="let p of products">

      <!-- IMAGEN -->
      <div class="product-image-wrapper">
        <ng-container *ngIf="p.picture; else noImageTpl">
          <img
            class="product-image"
            [src]="p.picture"
            [alt]="p.name"
          />
        </ng-container>
        <ng-template #noImageTpl>
          <div class="product-image">
            <span>Sin imagen</span>
          </div>
        </ng-template>
      </div>

      <!-- NOMBRE -->
      <h3 class="product-name">
        {{ p.name }}
      </h3>

      <!-- DESCRIPCIÓN -->
      <p class="product-description">
        {{ p.description || 'Este juego todavía no tiene descripción.' }}
      </p>

      <!-- PRECIO / STOCK -->
      <p class="price">
        {{ p.price | number:'1.2-2' }} €
      </p>
      <p class="stock">
        Stock: {{ p.stock }}
      </p>

      <!-- ACCIONES -->
      <div class="actions">

        <!-- Ver detalle (siempre) -->
        <a
          [routerLink]="['/product', p.id]"
          class="link-detail">
          Ver detalle
        </a>

        <div class="actions-right">

          <!-- Añadir al carrito (solo logueado) -->
          <button
            *ngIf="isLoggedIn"
            type="button"
            class="btn-edit"
            (click)="addToCart(p)">
            <i class="fa-solid fa-cart-plus" aria-hidden="true"></i>
          </button>

          <!-- Editar (solo admin) -->
          <a
            *ngIf="isAdmin"
            [routerLink]="['/product/edit', p.id]"
            class="btn-edit">
            <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i>
          </a>

          <!-- Eliminar (solo admin) -->
          <a
            *ngIf="isAdmin"
            [routerLink]="['/product/delete', p.id]"
            class="btn-delete">
            <i class="fa-solid fa-trash" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
