<h1>{{ isEditMode ? 'Editar producto' : 'Crear producto' }}</h1>

<form (ngSubmit)="onSubmit()">

  <!-- NOMBRE -->
  <label for="name">Nombre</label>
  <input
    id="name"
    name="name"
    type="text"
    [(ngModel)]="product.name"
    required
  />

  <!-- DESCRIPCIÓN -->
  <label for="description">Descripción</label>
  <textarea
    id="description"
    name="description"
    [(ngModel)]="product.description"
  ></textarea>

  <!-- PRECIO -->
  <label for="price">Precio (€)</label>
  <input
    id="price"
    name="price"
    type="number"
    [(ngModel)]="product.price"
    min="0"
  />

  <!-- STOCK -->
  <label for="stock">Stock</label>
  <input
    id="stock"
    name="stock"
    type="number"
    [(ngModel)]="product.stock"
    min="0"
  />

  <!-- EDAD RECOMENDADA -->
  <label for="recommendedAge">Edad recomendada</label>
  <input
    id="recommendedAge"
    name="recommendedAge"
    type="text"
    [(ngModel)]="product.recommendedAge"
  />

  <!-- JUGADORES MÍNIMO -->
  <label for="playerMin">Jugadores mínimo</label>
  <input
    id="playerMin"
    name="playerMin"
    type="number"
    [(ngModel)]="product.playerMin"
    min="0"
  />

  <!-- JUGADORES MÁXIMO -->
  <label for="playerMax">Jugadores máximo</label>
  <input
    id="playerMax"
    name="playerMax"
    type="number"
    [(ngModel)]="product.playerMax"
    min="0"
  />

  <!-- DURACIÓN -->
  <label for="duration">Duración (minutos)</label>
  <input
    id="duration"
    name="duration"
    type="number"
    [(ngModel)]="product.duration"
    min="0"
  />

  <!-- IMAGEN -->
  <label for="picture">URL de la imagen</label>
  <input
    id="picture"
    name="picture"
    type="text"
    [(ngModel)]="product.picture"
  />

  <!-- TAMAÑO CAJA -->
  <label for="boxSize">Tamaño de la caja</label>
  <input
    id="boxSize"
    name="boxSize"
    type="text"
    [(ngModel)]="product.boxSize"
  />

  <!-- DIFICULTAD -->
  <label for="difficulty">Dificultad</label>
  <input
    id="difficulty"
    name="difficulty"
    type="text"
    [(ngModel)]="product.difficulty"
  />

  <!-- MENSAJE -->
  <p *ngIf="mensaje">{{ mensaje }}</p>

  <!-- BOTONES -->
  <button type="submit">
    {{ isEditMode ? 'Actualizar producto' : 'Crear producto' }}
  </button>

  <button type="button" (click)="volver()">
    Volver
  </button>

</form>
