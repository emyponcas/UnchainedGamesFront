<div class="register-container">
  <h2>Crear cuenta</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <label for="name">Nombre</label>
    <input id="name" type="text" formControlName="name" />
    <div>
      El nombre es obligatorio.
    </div>

    <label for="surnames">Apellidos</label>
    <input id="surnames" type="text" formControlName="surnames" />
    <div class="error" *ngIf="form.get('surnames')?.touched && form.get('surnames')?.invalid">
      Los apellidos son obligatorios.
    </div>

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" />
    <div class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
      Introduce un email válido.
    </div>

    <label for="phoneNumber">Teléfono</label>
    <input id="phoneNumber" type="text" formControlName="phoneNumber" />
    <div class="error" *ngIf="form.get('phoneNumber')?.touched && form.get('phoneNumber')?.invalid">
      El teléfono es obligatorio.
    </div>

    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" />
    <div class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
      La contraseña es obligatoria (mínimo 6 caracteres).
    </div>

    <label for="confirmPassword">Repite la contraseña</label>
    <input id="confirmPassword" type="password" formControlName="confirmPassword" />
    <div class="error" *ngIf="form.get('confirmPassword')?.touched && form.get('confirmPassword')?.invalid">
      Debes repetir la contraseña.
    </div>

    <div class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Creando cuenta...' : 'Crear cuenta' }}
    </button>
  </form>
</div>
