<div>

  <div id="InicioSesion">

    <div id="logo">
      <img src="images/UnchLogoInic.png"/>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div id="info">
        <div>
          <h1>Inicio de Sesión</h1>
        </div>
        <div>
          <label for="correo">Correo electrónico</label>
          <input id="email"
                 type="email"
                 formControlName="email"
                 placeholder="tuemail@correo.com">
        </div>
        <div class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Introduce un email válido.
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input id="password"
                 type="password"
                 formControlName="password"
                 placeholder="••••••••">
        </div>
        <div class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          La contraseña es obligatoria.
        </div>
        <div>
          <button type="submit" [disabled]="loading">
            {{ loading ? 'Entrando...' : 'Entrar' }}
          </button>
        </div>
        <div>
          <p>¿No tienes una cuenta? <span><a routerLink="/register">Registrate</a></span></p>
        </div>
      </div>
    </form>

  </div>

</div>
