<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <h1 class="auth-title">Iniciar sesión</h1>
      <p class="auth-subtitle">
        Entra con tu cuenta de Unchained Games para gestionar tus pedidos y reseñas.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">

      <!-- EMAIL -->
      <div class="field">
        <label for="email">Email</label>
        <div class="field-input">
          <i class="fa-solid fa-envelope"></i>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="tuemail@correo.com"
          />
        </div>
        <div class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Introduce un email válido.
        </div>
      </div>

      <!-- PASSWORD -->
      <div class="field">
        <label for="password">Contraseña</label>
        <div class="field-input">
          <i class="fa-solid fa-lock"></i>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••"
          />
        </div>
        <div class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          La contraseña es obligatoria.
        </div>
      </div>

      <!-- MENSAJE DE ERROR GENERAL -->
      <p class="error global-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <!-- BOTÓN -->
      <button
        type="submit"
        class="btn-primary"
        [disabled]="loading || form.invalid"
      >
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>

      <!-- ENLACE A REGISTRO -->
      <p class="auth-footer-text">
        ¿Todavía no tienes cuenta?
        <a routerLink="/register">Crear cuenta</a>
      </p>
    </form>
  </div>
</div>
